name: Internal Checks

on:
  push:
    branches: [main, master, develop]
    paths:
      - "packages/backend/**"
      - "packages/updater/**"
      - "apps/desktop/**"
      - ".github/workflows/internal.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "packages/backend/**"
      - "packages/updater/**"
      - "apps/desktop/**"
      - ".github/workflows/internal.yml"

jobs:
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      # DuckDB 需要 cgo；MyGo 在 Linux 上运行时才用 purego 加载 GTK，构建只需要 C 编译器。
      - name: Configure cgo
        shell: bash
        run: echo 'CGO_ENABLED=1' >> "$GITHUB_ENV"

      - name: Configure macOS compilation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo 'CGO_CFLAGS=-mmacosx-version-min=12.0' >> "$GITHUB_ENV"
          echo 'CGO_LDFLAGS=-mmacosx-version-min=12.0' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"

      - name: Compile backend tests
        working-directory: packages/backend
        run: go test -run '^$' ./...

      - name: Compile desktop app and tests
        run: |
          go build ./...
          go test -run '^$' ./...
