name: Test Update Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '测试版本号（不含 v，格式：1.11.0-test.1）'
        required: true
        type: string
      previous_tag:
        description: '可选：用于生成 delta 的上一 release tag（例如 v1.11.0-test.1）'
        required: false
        type: string

run-name: Test update v${{ inputs.version }} from ${{ github.ref_name }}

concurrency:
  group: test-update-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Test Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      previous_version: ${{ steps.release.outputs.previous_version }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          VERSION="$(echo "$INPUT_VERSION" | xargs)"
          PREVIOUS_TAG="$(echo "$INPUT_PREVIOUS_TAG" | xargs)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "version must use X.Y.Z-test.N without a leading v" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; test tags are immutable" >&2
            exit 1
          fi

          PREVIOUS_VERSION=""
          if [ -n "$PREVIOUS_TAG" ]; then
            if [[ ! "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "previous_tag must be a SemVer tag beginning with v" >&2
              exit 1
            fi
            gh release view "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

  build-prerelease:
    name: Build Test Release
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
        mode: [portable, installer]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Setup Wails
        run: |
          $WailsVersion = (go list -m -f "{{.Version}}" github.com/wailsapp/wails/v2).Trim()
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WailsVersion"
        shell: pwsh

      - name: Setup MSYS2 for ARM64 CGO
        id: msys2
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          path-type: inherit
          install: mingw-w64-clang-aarch64-toolchain

      - name: Install NSIS
        if: matrix.mode == 'installer'
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Configure build architecture
        run: |
          "GOOS=windows" >> $env:GITHUB_ENV
          "GOARCH=${{ matrix.arch }}" >> $env:GITHUB_ENV
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"

          if ("${{ matrix.arch }}" -eq "arm64") {
            $SourceDir = Join-Path $PWD "lib\winarm64"
            $BuildLibDir = Join-Path $PWD "build\duckdb\winarm64"
            $DuckDBDll = Join-Path $SourceDir "duckdb.dll"
            $DuckDBLib = Join-Path $SourceDir "duckdb.lib"

            if (!(Test-Path $DuckDBDll) -or !(Test-Path $DuckDBLib)) {
              throw "Win-ARM64 DuckDB dynamic library is missing under lib\winarm64."
            }

            New-Item -ItemType Directory -Force -Path $BuildLibDir | Out-Null
            Copy-Item $DuckDBDll -Destination (Join-Path $BuildLibDir "duckdb.dll") -Force
            Copy-Item $DuckDBLib -Destination (Join-Path $BuildLibDir "duckdb.lib") -Force
            Copy-Item $DuckDBLib -Destination (Join-Path $BuildLibDir "libduckdb.dll.a") -Force

            $Msys2Location = "${{ steps.msys2.outputs.msys2-location }}"
            if ([string]::IsNullOrWhiteSpace($Msys2Location)) {
              throw "MSYS2 location output is empty."
            }

            $ClangArm64Bin = Join-Path $Msys2Location "clangarm64\bin"
            $Clang = Join-Path $ClangArm64Bin "clang.exe"
            $ClangXX = Join-Path $ClangArm64Bin "clang++.exe"
            if (!(Test-Path $Clang) -or !(Test-Path $ClangXX)) {
              throw "MSYS2 CLANGARM64 compiler was not found under $ClangArm64Bin."
            }
            $TargetTriple = "aarch64-w64-windows-gnu"
            $ClangTarget = (& $Clang --target=$TargetTriple -dumpmachine).Trim()
            if ($ClangTarget -notmatch "aarch64|arm64") {
              throw "MSYS2 CLANGARM64 compiler has unexpected target with --target=$TargetTriple`: $ClangTarget."
            }
            Write-Host "Using ARM64 CGO compiler: $Clang --target=$TargetTriple ($ClangTarget)"

            "MSYS2_LOCATION=$Msys2Location" >> $env:GITHUB_ENV
            "CGO_ENABLED=1" >> $env:GITHUB_ENV
            "CC=$Clang --target=$TargetTriple" >> $env:GITHUB_ENV
            "CXX=$ClangXX --target=$TargetTriple" >> $env:GITHUB_ENV
            "CGO_LDFLAGS=-L$BuildLibDir -lduckdb" >> $env:GITHUB_ENV
            "GO_BUILD_TAGS=duckdb_use_lib" >> $env:GITHUB_ENV
            "DUCKDB_DYNAMIC_DLL=$(Join-Path $BuildLibDir "duckdb.dll")" >> $env:GITHUB_ENV
            $env:MSYS2_LOCATION = $Msys2Location
            $env:CGO_ENABLED = "1"
            $env:CC = "$Clang --target=$TargetTriple"
            $env:CXX = "$ClangXX --target=$TargetTriple"
            $env:CGO_LDFLAGS = "-L$BuildLibDir -lduckdb"
            $env:PATH = "$ClangArm64Bin;$BuildLibDir;$env:PATH"
            go env -w CGO_ENABLED=1 CC="$env:CC" CXX="$env:CXX" CGO_LDFLAGS="$env:CGO_LDFLAGS"
            go env GOOS GOARCH GOHOSTOS GOHOSTARCH CGO_ENABLED CC CXX CGO_LDFLAGS
            go test -run "^$" -tags duckdb_use_lib github.com/duckdb/duckdb-go-bindings
            $ClangArm64Bin >> $env:GITHUB_PATH
            $BuildLibDir >> $env:GITHUB_PATH
          }
        shell: pwsh

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Generate version info
        id: version_info
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          $COMMIT = "${{ github.sha }}".Substring(0,7)
          $BUILD_TIME = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
          echo "COMMIT=$COMMIT" >> $env:GITHUB_OUTPUT
          echo "BUILD_TIME=$BUILD_TIME" >> $env:GITHUB_OUTPUT
          Write-Host "Test Version: $VERSION"
        shell: pwsh

      - name: Generate build env
        run: |
          $ErrorActionPreference = "Stop"
          $BangumiClientID = $env:LUNABOX_BANGUMI_CLIENT_ID
          $BangumiClientSecret = $env:LUNABOX_BANGUMI_CLIENT_SECRET
          $HikarinagiClientID = $env:LUNABOX_HIKARINAGI_CLIENT_ID
          $HikarinagiClientSecret = $env:LUNABOX_HIKARINAGI_CLIENT_SECRET
          $TouchGalToken = $env:LUNABOX_TOUCHGAL_TOKEN
          $UmbraClientID = $env:LUNABOX_UMBRA_CLIENT_ID
          $UmbraRegistrationToken = $env:LUNABOX_UMBRA_REGISTRATION_TOKEN

          if ([string]::IsNullOrWhiteSpace($BangumiClientID) -xor [string]::IsNullOrWhiteSpace($BangumiClientSecret)) {
            throw "LUNABOX_BANGUMI_CLIENT_ID and LUNABOX_BANGUMI_CLIENT_SECRET must be configured together."
          }
          if ([string]::IsNullOrWhiteSpace($HikarinagiClientID) -xor [string]::IsNullOrWhiteSpace($HikarinagiClientSecret)) {
            throw "LUNABOX_HIKARINAGI_CLIENT_ID and LUNABOX_HIKARINAGI_CLIENT_SECRET must be configured together."
          }
          $UmbraValues = @($UmbraClientID, $UmbraRegistrationToken)
          $UmbraConfiguredCount = @($UmbraValues | Where-Object { ![string]::IsNullOrWhiteSpace($_) }).Count
          if ($UmbraConfiguredCount -ne 0 -and $UmbraConfiguredCount -ne 2) {
            throw "LUNABOX_UMBRA_CLIENT_ID and LUNABOX_UMBRA_REGISTRATION_TOKEN must be configured together."
          }

          $Lines = @()
          if (![string]::IsNullOrWhiteSpace($BangumiClientID)) {
            $Lines += "LUNABOX_BANGUMI_CLIENT_ID=$BangumiClientID"
            $Lines += "LUNABOX_BANGUMI_CLIENT_SECRET=$BangumiClientSecret"
          }
          if (![string]::IsNullOrWhiteSpace($HikarinagiClientID)) {
            $Lines += "LUNABOX_HIKARINAGI_CLIENT_ID=$HikarinagiClientID"
            $Lines += "LUNABOX_HIKARINAGI_CLIENT_SECRET=$HikarinagiClientSecret"
          }
          if (![string]::IsNullOrWhiteSpace($TouchGalToken)) {
            $Lines += "LUNABOX_TOUCHGAL_TOKEN=$TouchGalToken"
          }
          if ($UmbraConfiguredCount -eq 2) {
            $Lines += "LUNABOX_UMBRA_CLIENT_ID=$UmbraClientID"
            $Lines += "LUNABOX_UMBRA_REGISTRATION_TOKEN=$UmbraRegistrationToken"
          }

          Set-Content -Path ".env.build" -Value $Lines -Encoding utf8
          Write-Host "Generated .env.build for build-time injection."
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_HIKARINAGI_CLIENT_SECRET: ${{ secrets.LUNABOX_HIKARINAGI_CLIENT_SECRET }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}

      - name: Build Portable with script
        if: matrix.mode == 'portable'
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\build.bat "portable" "${{ steps.version_info.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = "build/bin/LunaBox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Build artifact not found: $Artifact"
          }
        shell: pwsh

      - name: Build Installer Payload with script
        if: matrix.mode == 'installer'
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\build.bat "installer-payload" "${{ steps.version_info.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (!(Test-Path "build/bin/LunaBox.exe") -or !(Test-Path "build/bin/lunacli.exe") -or !(Test-Path "build/bin/LunaBoxUpdater.exe")) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Installer payload must contain LunaBox.exe, lunacli.exe, and LunaBoxUpdater.exe."
          }
        shell: pwsh

      - name: Upload Unsigned Portable Artifact
        id: upload-unsigned-portable
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-portable
          path: build/bin/LunaBox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: Sign Portable Artifact
        if: matrix.mode == 'portable'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG || 'github-portable' }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed

      - name: Verify signed portable artifact
        if: matrix.mode == 'portable'
        run: |
          $ErrorActionPreference = "Stop"
          $Artifact = "signed/LunaBox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path signed -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP "lunabox-signed-portable"
          if (Test-Path $ExtractDir) { Remove-Item $ExtractDir -Recurse -Force }
          Expand-Archive -Path $Artifact -DestinationPath $ExtractDir -Force
          $PayloadDir = (Get-ChildItem $ExtractDir -Filter "LunaBox.exe" -Recurse | Select-Object -First 1).Directory.FullName
          if ([string]::IsNullOrWhiteSpace($PayloadDir)) {
            throw "Signed portable archive does not contain LunaBox.exe."
          }
          foreach ($Name in @("LunaBox.exe", "lunacli.exe", "LunaBoxUpdater.exe")) {
            $Path = Join-Path $PayloadDir $Name
            if (!(Test-Path $Path)) { throw "Signed portable archive is missing $Name." }
            $Signature = Get-AuthenticodeSignature $Path
            if ($Signature.Status -ne "Valid") {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
          }

          $RuntimeDir = Join-Path $PWD "update-runtime"
          if (Test-Path $RuntimeDir) { Remove-Item $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @("LunaBox.exe", "lunacli.exe", "LunaBoxUpdater.exe", "duckdb.dll")) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          if (Test-Path (Join-Path $PayloadDir "7z")) {
            Copy-Item (Join-Path $PayloadDir "7z") -Destination $RuntimeDir -Recurse -Force
          }
        shell: pwsh

      - name: Upload Portable Artifact
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-portable
          path: signed/LunaBox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: Upload Unsigned Installer Payload
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-installer-payload
          path: |
            build/bin/LunaBox.exe
            build/bin/lunacli.exe
            build/bin/LunaBoxUpdater.exe
          if-no-files-found: error

      - name: Sign Installer Payload
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-installer-payload' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-payload

      - name: Build Installer from signed payload
        if: matrix.mode == 'installer'
        run: |
          $ErrorActionPreference = "Stop"
          $SignedGui = "signed-payload/LunaBox.exe"
          $SignedCli = "signed-payload/lunacli.exe"
          $SignedUpdater = "signed-payload/LunaBoxUpdater.exe"
          if (!(Test-Path $SignedGui) -or !(Test-Path $SignedCli) -or !(Test-Path $SignedUpdater)) {
            Get-ChildItem -Path signed-payload -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed installer payload must contain LunaBox.exe, lunacli.exe, and LunaBoxUpdater.exe."
          }
          foreach ($Path in @($SignedGui, $SignedCli, $SignedUpdater)) {
            $Signature = Get-AuthenticodeSignature $Path
            if ($Signature.Status -ne "Valid") {
              throw "$(Split-Path $Path -Leaf) does not have a valid Authenticode signature: $($Signature.Status)"
            }
          }

          Copy-Item $SignedGui -Destination "build/bin/LunaBox.exe" -Force
          Copy-Item $SignedCli -Destination "build/bin/lunacli.exe" -Force
          Copy-Item $SignedUpdater -Destination "build/bin/LunaBoxUpdater.exe" -Force

          .\scripts\build.bat "installer-package" "${{ steps.version_info.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = "build/bin/LunaBox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Installer artifact not found: $Artifact"
          }

          $RuntimeDir = Join-Path $PWD "update-runtime"
          if (Test-Path $RuntimeDir) { Remove-Item $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @("LunaBox.exe", "lunacli.exe", "LunaBoxUpdater.exe", "duckdb.dll")) {
            $Source = Join-Path "build/bin" $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          if (Test-Path "build/bin/7z") {
            Copy-Item "build/bin/7z" -Destination $RuntimeDir -Recurse -Force
          }
        shell: pwsh

      - name: Upload update runtime input
        uses: actions/upload-artifact@v4
        with:
          name: update-runtime-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-${{ matrix.mode }}
          path: update-runtime/
          if-no-files-found: error

      - name: Upload Unsigned Installer Artifact
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-installer
          path: build/bin/LunaBox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

      - name: Sign Installer Artifact
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed

      - name: Verify signed installer artifact
        if: matrix.mode == 'installer'
        run: |
          $ErrorActionPreference = "Stop"
          $Artifact = "signed/LunaBox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path signed -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed installer artifact not found: $Artifact"
          }
        shell: pwsh

      - name: Upload Installer Artifact
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-installer
          path: signed/LunaBox-${{ steps.version_info.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  create-prerelease:
    name: Create Test Update Release
    needs: [prepare, build-prerelease]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate version info
        id: version_info
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          COMMIT="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT=$COMMIT" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunabox-*
          path: ./artifacts

      - name: Download signed update runtime inputs
        uses: actions/download-artifact@v4
        with:
          pattern: update-runtime-*
          path: ./update-runtime-artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find ./artifacts -type f \( -name "*.zip" -o -name "*.exe" \) -exec cp {} ./release/ \;
          ls -lh ./release

      - name: Download previous update baseline
        if: needs.prepare.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
        run: |
          mkdir -p previous-update-assets
          gh release download "$PREVIOUS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "LunaBox-${PREVIOUS_VERSION}-windows-*-LunaBox.exe.zst" \
            --dir previous-update-assets

      - name: Install Zstandard CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Generate full and delta update assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
        run: |
          ARGS=(
            --input-root ./update-runtime-artifacts
            --output ./release
            --version "$VERSION"
            --repository "$GITHUB_REPOSITORY"
          )
          if [ -n "$PREVIOUS_VERSION" ]; then
            ARGS+=(
              --previous-root ./previous-update-assets
              --previous-version "$PREVIOUS_VERSION"
            )
          fi
          go run ./cmd/lunabox-update-builder "${ARGS[@]}"
          jq empty "release/LunaBox-${VERSION}-update-manifest.json"

      - name: Generate test version source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/LunaBox-${VERSION}-update-manifest.json"
          jq -n \
            --arg version "$VERSION" \
            --arg release_date "$(date -u +%F)" \
            --arg release_url "$RELEASE_URL" \
            --arg manifest_url "$MANIFEST_URL" \
            '{
              version: $version,
              release_date: $release_date,
              changelog: ["LunaBox 应用内更新测试版本"],
              downloads: {github: $release_url},
              update_manifest_url: $manifest_url
            }' > "release/LunaBox-${VERSION}-version.json"
          jq empty "release/LunaBox-${VERSION}-version.json"

      - name: Get commit messages
        id: get_commits
        run: |
          # 获取最近5个提交的信息
          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%h)" -n 5 >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          VERSION_SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/LunaBox-${VERSION}-version.json"
          if [ -n "$PREVIOUS_TAG" ]; then
            UPDATE_KIND="已尝试生成从 ${PREVIOUS_TAG} 到 ${TAG} 的 LunaBox.exe delta；详细结果以 update manifest 中是否包含 patch 为准。"
          else
            UPDATE_KIND="未指定上一版本，本次只生成 full 更新资产。"
          fi

          cat << EOF > release_notes.md
          ## LunaBox 应用内更新测试版

          - 版本：\`${VERSION}\`
          - 分支：\`${{ github.ref_name }}\`
          - 提交：[\`${{ steps.version_info.outputs.COMMIT }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - 构建时间：$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ${UPDATE_KIND}

          ### 更新测试

          将待更新 LunaBox 的 \`update_check_url\` 设为：

          \`${VERSION_SOURCE_URL}\`

          正式 Cloudflare \`version.json\` 不会被此工作流修改。

          ### 最近提交

          ${{ steps.get_commits.outputs.COMMITS }}
          
          ### 下载说明
          
          | 文件 | 说明 |
          |------|------|
          | \`*-portable.zip\` | 便携版，解压即用，数据存储在程序目录 |
          | \`*-setup.exe\` | 安装版，标准安装程序，数据存储在 %APPDATA%\\\\LunaBox |
          
          EOF

          cat release_notes.md

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "更新测试版 - ${{ needs.prepare.outputs.version }}"
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
