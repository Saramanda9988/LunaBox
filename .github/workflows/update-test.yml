name: Test Update Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '测试版本号（不含 v，格式：1.11.0-test.1）'
        required: true
        type: string
      previous_tag:
        description: '可选：用于生成 delta 的上一 release tag（例如 v1.11.0-test.1）'
        required: false
        type: string

run-name: Test update v${{ inputs.version }} from ${{ github.ref_name }}

concurrency:
  group: test-update-${{ inputs.version }}
  cancel-in-progress: false

env:
  LUNABOX_UPDATE_SERVICE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}

jobs:
  prepare:
    name: Validate Test Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      previous_version: ${{ steps.release.outputs.previous_version }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          VERSION="$(echo "$INPUT_VERSION" | xargs)"
          PREVIOUS_TAG="$(echo "$INPUT_PREVIOUS_TAG" | xargs)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "version must use X.Y.Z-test.N without a leading v" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; test tags are immutable" >&2
            exit 1
          fi

          PREVIOUS_VERSION=""
          if [ -n "$PREVIOUS_TAG" ]; then
            if [[ ! "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "previous_tag must be a SemVer tag beginning with v" >&2
              exit 1
            fi
            gh release view "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

  build-prerelease:
    name: Windows ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            mode: portable
            runner: windows-2025
          - arch: amd64
            mode: installer
            runner: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      - name: Install NSIS
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH

      - name: Build portable package
        if: matrix.mode == 'portable'
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./tools/release -version '${{ needs.prepare.outputs.version }}' -arch '${{ matrix.arch }}' -mode portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # tools/release 在 zip 旁边留了解压好的目录，签名后在这里换上签名的 exe 再重新打包。
          $PortableDir = 'build/release/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable'
          $SigningDir = 'build/signing/test-portable-payload'
          if (Test-Path -LiteralPath $SigningDir) {
            Remove-Item -LiteralPath $SigningDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $SigningDir | Out-Null
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            $Source = Join-Path $PortableDir $Name
            if (!(Test-Path -LiteralPath $Source)) {
              throw "Portable package is missing $Name."
            }
            Copy-Item -LiteralPath $Source -Destination $SigningDir -Force
          }

      - name: Build installer payload
        if: matrix.mode == 'installer'
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./tools/release -version '${{ needs.prepare.outputs.version }}' -arch '${{ matrix.arch }}' -mode installer-payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PayloadDir = 'build/release/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-installer'
          $SigningDir = 'build/signing/test-installer-payload'
          if (Test-Path -LiteralPath $SigningDir) {
            Remove-Item -LiteralPath $SigningDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $SigningDir | Out-Null
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            $Source = Join-Path $PayloadDir $Name
            if (!(Test-Path -LiteralPath $Source)) {
              throw "Installer payload is missing $Name."
            }
            Copy-Item -LiteralPath $Source -Destination $SigningDir -Force
          }

      - name: Upload unsigned portable artifact
        id: upload-unsigned-portable
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: apps/desktop/build/signing/test-portable-payload/
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable artifact
        if: matrix.mode == 'portable'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_TEST_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-test-installer-payload-v3' }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed-portable-payload

      - name: Verify signed portable artifact
        if: matrix.mode == 'portable'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PortableDir = 'build/release/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable'
          $SignedPayloadDir = 'signed-portable-payload'
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            $SignedFile = Join-Path $SignedPayloadDir $Name
            if (!(Test-Path -LiteralPath $SignedFile)) {
              Get-ChildItem -Path $SignedPayloadDir -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw "Signed portable payload is missing $Name."
            }
            $Signature = Get-AuthenticodeSignature $SignedFile
            if ($Signature.Status -ne 'Valid') {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
            Copy-Item -LiteralPath $SignedFile -Destination $PortableDir -Force
          }

          New-Item -ItemType Directory -Force -Path 'signed' | Out-Null
          $Artifact = 'signed/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (Test-Path -LiteralPath $Artifact) { Remove-Item -LiteralPath $Artifact -Force }
          Compress-Archive -LiteralPath $PortableDir -DestinationPath $Artifact -CompressionLevel Optimal

          # 应用内更新的输入：签名后的运行时文件，布局同程序目录。
          $RuntimeDir = Join-Path $PWD 'update-runtime'
          if (Test-Path -LiteralPath $RuntimeDir) { Remove-Item -LiteralPath $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe', 'duckdb.dll')) {
            $Source = Join-Path $PortableDir $Name
            if (Test-Path -LiteralPath $Source) { Copy-Item -LiteralPath $Source -Destination $RuntimeDir -Force }
          }
          Copy-Item -LiteralPath (Join-Path $PortableDir '7z') -Destination $RuntimeDir -Recurse -Force

      - name: Upload portable artifact
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: apps/desktop/signed/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: Upload unsigned installer payload
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-installer-payload
          path: apps/desktop/build/signing/test-installer-payload/
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer payload
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_TEST_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-test-installer-payload-v3' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed-payload

      - name: Build installer from signed payload
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PayloadDir = 'build/release/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-installer'
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            $SignedFile = "signed-payload/$Name"
            if (!(Test-Path -LiteralPath $SignedFile)) {
              Get-ChildItem -Path signed-payload -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw 'Signed installer payload must contain LunaBox.exe, lunacli.exe, and LunaBoxUpdater.exe.'
            }
            $Signature = Get-AuthenticodeSignature $SignedFile
            if ($Signature.Status -ne 'Valid') {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
            Copy-Item -LiteralPath $SignedFile -Destination (Join-Path $PayloadDir $Name) -Force
          }

          go run ./tools/release -version '${{ needs.prepare.outputs.version }}' -arch '${{ matrix.arch }}' -mode installer-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/release/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Installer artifact not found: $Artifact"
          }

          # 应用内更新的输入：安装包的内容（已换成签名后的 exe），布局同安装目录。
          $RuntimeDir = Join-Path $PWD 'update-runtime'
          if (Test-Path -LiteralPath $RuntimeDir) { Remove-Item -LiteralPath $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe', 'duckdb.dll')) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path -LiteralPath $Source) { Copy-Item -LiteralPath $Source -Destination $RuntimeDir -Force }
          }
          Copy-Item -LiteralPath (Join-Path $PayloadDir '7z') -Destination $RuntimeDir -Recurse -Force

      - name: Upload update runtime input
        uses: actions/upload-artifact@v4
        with:
          name: update-runtime-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-${{ matrix.mode }}
          path: apps/desktop/update-runtime/
          if-no-files-found: error

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: apps/desktop/build/release/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed-installer

      - name: Verify signed installer
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Artifact = "signed-installer/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path signed-installer -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed installer artifact not found: $Artifact"
          }

      - name: Upload installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: apps/desktop/signed-installer/LunaBox-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  create-prerelease:
    name: Create Test Update Release
    needs: [prepare, build-prerelease]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/updater/go.mod
          cache-dependency-path: packages/updater/go.sum

      - name: Generate version info
        id: version_info
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          COMMIT="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT=$COMMIT" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunabox-*
          path: ./artifacts

      - name: Download signed update runtime inputs
        uses: actions/download-artifact@v4
        with:
          pattern: update-runtime-*
          path: ./update-runtime-artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find ./artifacts -type f \( -name "*.zip" -o -name "*.exe" \) -exec cp {} ./release/ \;
          ls -lh ./release

      - name: Download previous update baseline
        if: needs.prepare.outputs.previous_tag != ''
        env:
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          mkdir -p previous-update-assets
          aws s3 cp \
            "s3://${UPDATE_S3_BUCKET}/releases/${PREVIOUS_VERSION}/" \
            ./previous-update-assets/ \
            --recursive \
            --exclude "*" \
            --include "LunaBox-${PREVIOUS_VERSION}-windows-*-LunaBox.exe.zst" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"

      - name: Install Zstandard CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Generate full and delta update assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          test -n "$UPDATE_PUBLIC_BASE_URL"
          ASSET_BASE_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/assets"
          ARGS=(
            --input-root "$GITHUB_WORKSPACE/update-runtime-artifacts"
            --output "$GITHUB_WORKSPACE/update-assets"
            --version "$VERSION"
            --asset-base-url "$ASSET_BASE_URL"
            --event-url "${UPDATE_PUBLIC_BASE_URL%/}/v1/events"
            --architectures amd64
          )
          if [ -n "$PREVIOUS_VERSION" ]; then
            ARGS+=(
              --previous-root "$GITHUB_WORKSPACE/previous-update-assets"
              --previous-version "$PREVIOUS_VERSION"
            )
          fi
          go -C packages/updater run ./cmd/lunabox-update-builder "${ARGS[@]}"
          jq empty "update-assets/LunaBox-${VERSION}-update-manifest.json"

      - name: Generate test version source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          SOURCE_FILE="sync/version-test.json"
          SOURCE_VERSION="$(jq -r '.version // empty' "$SOURCE_FILE")"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "$SOURCE_FILE version $SOURCE_VERSION does not match release version $VERSION" >&2
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          MANIFEST_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/manifest"
          jq \
            --arg release_url "$RELEASE_URL" \
            --arg manifest_url "$MANIFEST_URL" \
            '.downloads.github = $release_url | .update_manifest_url = $manifest_url' \
            "$SOURCE_FILE" > "update-assets/version.json"
          jq empty "update-assets/version.json"

      - name: Upload update assets to S3
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          test -n "$UPDATE_S3_BUCKET"
          test -n "$UPDATE_S3_ENDPOINT"
          PREFIX="s3://${UPDATE_S3_BUCKET}/releases/${VERSION}"
          aws s3 cp ./update-assets "$PREFIX/" \
            --recursive \
            --exclude "*" \
            --include "*.zst" \
            --include "*.zsdiff" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp "update-assets/LunaBox-${VERSION}-update-manifest.json" "$PREFIX/manifest.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp update-assets/version.json "$PREFIX/version.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"

      - name: Get commit messages
        id: get_commits
        env:
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${GITHUB_SHA}" >> $GITHUB_OUTPUT
          else
            git log --pretty=format:"- %s (%h)" -n 5 "$GITHUB_SHA" >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          VERSION_SOURCE_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/version"
          if [ -n "$PREVIOUS_TAG" ]; then
            UPDATE_KIND="已尝试生成从 ${PREVIOUS_TAG} 到 ${TAG} 的 LunaBox.exe delta；详细结果以 update manifest 中是否包含 patch 为准。"
          else
            UPDATE_KIND="未指定上一版本，本次只生成 full 更新资产。"
          fi

          cat << EOF > release_notes.md
          ## LunaBox 应用内更新测试版

          - 版本：\`${VERSION}\`
          - 分支：\`${{ github.ref_name }}\`
          - 提交：[\`${{ steps.version_info.outputs.COMMIT }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - 构建时间：$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ${UPDATE_KIND}

          ### 更新测试

          将待更新 LunaBox 的 \`update_check_url\` 设为：

          \`${VERSION_SOURCE_URL}\`

          正式 Cloudflare \`version.json\` 不会被此工作流修改。

          ### 版本提交

          ${{ steps.get_commits.outputs.COMMITS }}
          
          ### 下载说明
          
          | 文件 | 说明 |
          |------|------|
          | \`*-portable.zip\` | 便携版，解压即用，数据存储在程序目录 |
          | \`*-setup.exe\` | 安装版，标准安装程序，数据存储在 %APPDATA%\\\\LunaBox |
          
          EOF

          cat release_notes.md

      - name: Create Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "更新测试版 - ${{ needs.prepare.outputs.version }}"
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
