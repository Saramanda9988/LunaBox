name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，格式为 vX.Y.Z，例如 v1.14.0；去除 v 后须与 sync/version.json 和 apps/desktop/mygo.json 一致'
        required: true
        type: string

env:
  LUNABOX_UPDATE_SERVICE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}

jobs:
  prepare-release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      tag: ${{ steps.release_version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release version
        id: release_version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use the vX.Y.Z format: $INPUT_VERSION" >&2
            exit 1
          fi
          VERSION="${INPUT_VERSION#v}"
          SOURCE_VERSION="$(jq -r '.version // empty' sync/version.json)"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "sync/version.json version $SOURCE_VERSION does not match release version $VERSION" >&2
            exit 1
          fi
          BUILD_VERSION="$(jq -r '.version // empty' apps/desktop/mygo.json)"
          if [ "$BUILD_VERSION" != "$VERSION" ]; then
            echo "apps/desktop/mygo.json version $BUILD_VERSION does not match release version $VERSION" >&2
            echo "Update the version field in apps/desktop/mygo.json and commit it before releasing." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag at the triggering commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            TAG_COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG points to $TAG_COMMIT, expected $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  # 三端都用 apps/desktop/tools/release 构建，发布包的文件名与包内布局沿用 Wails 版（应用内更新与已安装的旧版依赖它）。
  build-release:
    needs: prepare-release
    name: Windows ${{ matrix.arch }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    permissions:
      actions: read
      contents: read
    env:
      LLVM_MINGW_VERSION: '20261006'
      LLVM_MINGW_SHA256: 9a835d5179c9f3a5a783c11a7f14062a249b4765dd11add64a66786864e82ab2
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            mode: portable
            runner: windows-2025
          - arch: arm64
            mode: portable
            runner: windows-11-arm
          - arch: amd64
            mode: installer
            runner: windows-2025
          - arch: arm64
            mode: installer
            runner: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      # arm64 的 cgo 用 llvm-mingw 预编译工具链（clang + lld + UCRT，与 MSYS2 CLANGARM64 同一套），按版本缓存。
      - name: Restore ARM64 llvm-mingw toolchain
        id: llvm-mingw-cache
        if: matrix.arch == 'arm64'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-aarch64

      - name: Download ARM64 llvm-mingw toolchain
        if: matrix.arch == 'arm64' && steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $Name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64"
          $Zip = Join-Path $env:RUNNER_TEMP "$Name.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$Name.zip" -OutFile $Zip
          $Hash = (Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Hash -ne $env:LLVM_MINGW_SHA256) {
            throw "llvm-mingw checksum mismatch: expected $env:LLVM_MINGW_SHA256, got $Hash"
          }
          $ExtractDir = Join-Path $env:RUNNER_TEMP 'llvm-mingw-extract'
          if (Test-Path -LiteralPath $ExtractDir) { Remove-Item -LiteralPath $ExtractDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $ExtractDir | Out-Null
          # 系统自带的 bsdtar 解 zip 比 Expand-Archive 快得多。
          & (Join-Path $env:SystemRoot 'System32\tar.exe') -xf $Zip -C $ExtractDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Dest = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          if (Test-Path -LiteralPath $Dest) { Remove-Item -LiteralPath $Dest -Recurse -Force }
          Move-Item -LiteralPath (Join-Path $ExtractDir $Name) -Destination $Dest
          Remove-Item -LiteralPath $Zip -Force

      # tools/release 找不到 MSYS2 时沿用 CC，并用 -dumpmachine 检查它的目标架构。
      - name: Export ARM64 C compiler
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Bin = Join-Path (Join-Path $env:RUNNER_TEMP 'llvm-mingw') 'bin'
          $Cc = Join-Path $Bin 'aarch64-w64-mingw32-clang.exe'
          $Cxx = Join-Path $Bin 'aarch64-w64-mingw32-clang++.exe'
          foreach ($Path in @($Cc, $Cxx)) {
            if (!(Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "llvm-mingw is missing $Path."
            }
          }
          & $Cc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Bin >> $env:GITHUB_PATH
          "CC=$Cc" >> $env:GITHUB_ENV
          "CXX=$Cxx" >> $env:GITHUB_ENV

      # 运行器镜像自带 NSIS 时直接用，找不到才用 choco 安装。
      - name: Ensure NSIS
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (!$Makensis) {
            $Makensis = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) |
              Where-Object { $_ } |
              ForEach-Object { Join-Path $_ 'NSIS\makensis.exe' } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
              Select-Object -First 1
          }
          if (!$Makensis) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $Makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          }
          Split-Path -Parent $Makensis >> $env:GITHUB_PATH
          & $Makensis /VERSION

      - name: Build portable package
        if: matrix.mode == 'portable'
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./tools/release -version '${{ needs.prepare-release.outputs.version }}' -arch '${{ matrix.arch }}' -mode portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Name = 'LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-portable'
          $Artifact = "build/release/$Name.zip"
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'lunabox-portable-check'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          $Root = Join-Path $ExtractDir $Name
          $Files = @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe', '7z/7z.exe', '7z/7z.dll', 'README.txt')
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $Files += 'duckdb.dll'
          }
          foreach ($Path in $Files) {
            if (!(Test-Path -LiteralPath (Join-Path $Root $Path) -PathType Leaf)) {
              throw "Portable artifact is missing $Name/$Path."
            }
          }
          foreach ($Path in @('backups', 'covers', 'backgrounds', 'logs')) {
            if (!(Test-Path -LiteralPath (Join-Path $Root $Path) -PathType Container)) {
              throw "Portable artifact is missing directory $Name/$Path."
            }
          }

      - name: Build installer payload
        if: matrix.mode == 'installer'
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./tools/release -version '${{ needs.prepare-release.outputs.version }}' -arch '${{ matrix.arch }}' -mode installer-payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PayloadDir = 'build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-installer'
          $Files = @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe', '7z/7z.exe', '7z/7z.dll')
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $Files += 'duckdb.dll'
          }
          foreach ($Path in $Files) {
            if (!(Test-Path -LiteralPath (Join-Path $PayloadDir $Path) -PathType Leaf)) {
              throw "Installer payload is missing $Path."
            }
          }

          $SigningDir = 'build/signing/installer-payload'
          if (Test-Path -LiteralPath $SigningDir) {
            Remove-Item -LiteralPath $SigningDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $SigningDir | Out-Null
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            Copy-Item -LiteralPath (Join-Path $PayloadDir $Name) -Destination $SigningDir -Force
          }

      - name: Upload unsigned portable artifact
        id: upload-unsigned-portable
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: apps/desktop/build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable artifact
        if: matrix.mode == 'portable'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG || 'github-portable' }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed

      - name: Verify signed portable artifact
        if: matrix.mode == 'portable'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Artifact = 'signed/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            Get-ChildItem -Path signed -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'lunabox-signed-portable'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          $PayloadDir = (Get-ChildItem $ExtractDir -Filter 'LunaBox.exe' -Recurse | Select-Object -First 1).Directory.FullName
          if ([string]::IsNullOrWhiteSpace($PayloadDir)) {
            throw 'Signed portable archive does not contain LunaBox.exe.'
          }
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            $Path = Join-Path $PayloadDir $Name
            if (!(Test-Path -LiteralPath $Path)) { throw "Signed portable archive is missing $Name." }
            $Signature = Get-AuthenticodeSignature $Path
            if ($Signature.Status -ne 'Valid') {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
          }

          # 应用内更新的输入：签名后的运行时文件，布局同程序目录。
          $RuntimeDir = Join-Path $PWD 'update-runtime'
          if (Test-Path -LiteralPath $RuntimeDir) { Remove-Item -LiteralPath $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe', 'duckdb.dll')) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path -LiteralPath $Source) { Copy-Item -LiteralPath $Source -Destination $RuntimeDir -Force }
          }
          Copy-Item -LiteralPath (Join-Path $PayloadDir '7z') -Destination $RuntimeDir -Recurse -Force

      - name: Upload portable artifact
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: apps/desktop/signed/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: Upload unsigned installer payload
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-installer-payload
          path: apps/desktop/build/signing/installer-payload/
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer payload
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-installer-payload' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed-payload

      - name: Build installer from signed payload
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PayloadDir = 'build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-installer'
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            $SignedFile = "signed-payload/$Name"
            if (!(Test-Path -LiteralPath $SignedFile)) {
              Get-ChildItem -Path signed-payload -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw 'Signed installer payload must contain LunaBox.exe, lunacli.exe, and LunaBoxUpdater.exe.'
            }
            $Signature = Get-AuthenticodeSignature $SignedFile
            if ($Signature.Status -ne 'Valid') {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
            Copy-Item -LiteralPath $SignedFile -Destination (Join-Path $PayloadDir $Name) -Force
          }

          go run ./tools/release -version '${{ needs.prepare-release.outputs.version }}' -arch '${{ matrix.arch }}' -mode installer-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Installer artifact not found: $Artifact"
          }

          # 应用内更新的输入：安装包的内容（已换成签名后的 exe），布局同安装目录。
          $RuntimeDir = Join-Path $PWD 'update-runtime'
          if (Test-Path -LiteralPath $RuntimeDir) { Remove-Item -LiteralPath $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe', 'duckdb.dll')) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path -LiteralPath $Source) { Copy-Item -LiteralPath $Source -Destination $RuntimeDir -Force }
          }
          Copy-Item -LiteralPath (Join-Path $PayloadDir '7z') -Destination $RuntimeDir -Recurse -Force

      - name: Upload update runtime input
        uses: actions/upload-artifact@v4
        with:
          name: update-runtime-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-${{ matrix.mode }}
          path: apps/desktop/update-runtime/
          if-no-files-found: error

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: apps/desktop/build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed-installer

      - name: Verify signed installer
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $Artifact = 'signed-installer/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            Get-ChildItem -Path signed-installer -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed installer artifact not found: $Artifact"
          }

      - name: Upload installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: apps/desktop/signed-installer/LunaBox-${{ needs.prepare-release.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  build-macos:
    needs: prepare-release
    name: macOS ${{ matrix.arch }} / DMG
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      - name: Build app bundle and DMG
        shell: bash
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          set -euo pipefail
          go run ./tools/release -version '${{ needs.prepare-release.outputs.version }}' -arch '${{ matrix.arch }}' -mode installer

          artifact='build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-macos-${{ matrix.arch }}.dmg'
          test -f "$artifact"

          mount_dir="${RUNNER_TEMP}/lunabox-dmg-check"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$artifact" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null || true' EXIT
          for path in LunaBox.app/Contents/MacOS/LunaBox LunaBox.app/Contents/Resources/bin/lunacli LunaBox.app/Contents/Resources/bin/7zz; do
            if [[ ! -x "$mount_dir/$path" ]]; then
              echo "DMG is missing executable $path." >&2
              exit 1
            fi
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mount_dir/LunaBox.app/Contents/Info.plist")" = 'io.github.saramanda9988.lunabox'
          test -L "$mount_dir/Applications"
          codesign --verify --deep --strict "$mount_dir/LunaBox.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.prepare-release.outputs.version }}-macos-${{ matrix.arch }}
          path: apps/desktop/build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  build-linux:
    needs: prepare-release
    name: Linux ${{ matrix.arch }} / Packages
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      # 运行时才用 purego 加载 GTK，构建只需要 DuckDB 的 cgo 编译器；
      # desktop-file-utils 让 appimagetool 校验桌面入口。
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl desktop-file-utils

      - name: Install nFPM
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm --version

      - name: Install appimagetool
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            amd64) appimage_arch='x86_64' ;;
            arm64) appimage_arch='aarch64' ;;
            *) echo 'Unsupported AppImage architecture: ${{ matrix.arch }}' >&2; exit 1 ;;
          esac
          tool_path="${RUNNER_TEMP:-/tmp}/appimagetool-${appimage_arch}.AppImage"
          curl -fsSL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${appimage_arch}.AppImage" \
            -o "$tool_path"
          chmod 755 "$tool_path"
          sudo install -m 0755 "$tool_path" /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - name: Build Linux packages
        shell: bash
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          go run ./tools/release -version '${{ needs.prepare-release.outputs.version }}' -arch '${{ matrix.arch }}' -mode all

          base="$PWD/build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-linux-${{ matrix.arch }}"
          test -x "$base.AppImage"
          test -f "$base.deb"
          test -f "$base.rpm"

          extract_dir="${RUNNER_TEMP}/lunabox-appimage-check"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          (cd "$extract_dir" && env -u APPIMAGE_EXTRACT_AND_RUN "$base.AppImage" --appimage-extract >/dev/null)
          for path in AppRun usr/bin/LunaBox usr/bin/lunacli usr/bin/7zz; do
            if [[ ! -x "$extract_dir/squashfs-root/$path" ]]; then
              echo "AppImage is missing executable $path." >&2
              exit 1
            fi
          done

          deb_files="$(dpkg-deb -c "$base.deb")"
          for path in ./usr/bin/LunaBox ./usr/bin/lunacli ./usr/lib/lunabox/LunaBox ./usr/lib/lunabox/7zz; do
            if ! grep -Eq "^-rwxr-xr-x .* ${path}\$" <<<"$deb_files"; then
              echo "deb is missing executable $path." >&2
              exit 1
            fi
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.prepare-release.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            apps/desktop/build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-linux-${{ matrix.arch }}.deb
            apps/desktop/build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-linux-${{ matrix.arch }}.rpm
            apps/desktop/build/release/LunaBox-${{ needs.prepare-release.outputs.version }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [prepare-release, build-release, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/updater/go.mod
          cache-dependency-path: packages/updater/go.sum

      - name: Get prepared release version
        id: get_version
        run: echo "VERSION=${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunabox-*
          path: ./artifacts
          merge-multiple: true

      - name: Download signed update runtime inputs
        uses: actions/download-artifact@v4
        with:
          pattern: update-runtime-*
          path: ./update-runtime-artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find ./artifacts -maxdepth 1 -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} ./release/ \;
          test "$(find ./release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 12
          ls -lh ./release

      - name: Find previous stable release
        id: previous_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          CURRENT_TAG="${{ needs.prepare-release.outputs.tag }}"
          PREVIOUS_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft,isPrerelease --jq "[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != \"$CURRENT_TAG\")][0].tagName // \"\"")"
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p previous-update-assets
          if [ -n "$PREVIOUS_TAG" ]; then
            aws s3 cp \
              "s3://${UPDATE_S3_BUCKET}/releases/${PREVIOUS_VERSION}/" \
              ./previous-update-assets/ \
              --recursive \
              --exclude "*" \
              --include "LunaBox-${PREVIOUS_VERSION}-windows-*-LunaBox.exe.zst" \
              --endpoint-url "$UPDATE_S3_ENDPOINT" || true
          fi

      - name: Install Zstandard CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Generate full and delta update assets
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          PREVIOUS_VERSION: ${{ steps.previous_release.outputs.version }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          test -n "$UPDATE_PUBLIC_BASE_URL"
          ASSET_BASE_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/assets"
          ARGS=(
            --input-root "$GITHUB_WORKSPACE/update-runtime-artifacts"
            --previous-root "$GITHUB_WORKSPACE/previous-update-assets"
            --output "$GITHUB_WORKSPACE/update-assets"
            --version "$VERSION"
            --asset-base-url "$ASSET_BASE_URL"
            --event-url "${UPDATE_PUBLIC_BASE_URL%/}/v1/events"
          )
          if [ -n "$PREVIOUS_VERSION" ]; then
            ARGS+=(--previous-version "$PREVIOUS_VERSION")
          fi
          go -C packages/updater run ./cmd/lunabox-update-builder "${ARGS[@]}"
          jq empty "update-assets/LunaBox-${VERSION}-update-manifest.json"
          ls -lh ./update-assets

      - name: Generate update version source
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          SOURCE_FILE="sync/version.json"
          SOURCE_VERSION="$(jq -r '.version // empty' "$SOURCE_FILE")"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "$SOURCE_FILE version $SOURCE_VERSION does not match release version $VERSION" >&2
            exit 1
          fi
          cp "$SOURCE_FILE" update-assets/version.json
          jq empty update-assets/version.json

      - name: Upload update assets to S3
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          test -n "$UPDATE_S3_BUCKET"
          test -n "$UPDATE_S3_ENDPOINT"
          PREFIX="s3://${UPDATE_S3_BUCKET}/releases/${VERSION}"
          aws s3 cp ./update-assets "$PREFIX/" \
            --recursive \
            --exclude "*" \
            --include "*.zst" \
            --include "*.zsdiff" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp "update-assets/LunaBox-${VERSION}-update-manifest.json" "$PREFIX/manifest.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp update-assets/version.json "$PREFIX/version.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # 检查是否存在 CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # 提取当前版本的 changelog
            # 命中 ## VERSION / ## vVERSION 后，输出到下一个二级标题前为止
            awk -v version="$VERSION" '
              function normalize_heading(line, heading) {
                heading = line
                sub(/^##[[:space:]]+/, "", heading)
                sub(/^v/, "", heading)
                sub(/[[:space:]]+$/, "", heading)
                return heading
              }

              /^##[[:space:]]+/ {
                current = normalize_heading($0)
                if (found && current != version) {
                  exit
                }
                if (current == version) {
                  found = 1
                }
              }

              found {
                print
              }
            ' CHANGELOG.md > release_notes.md

            # 如果没有找到对应版本的内容，文件会是空的
            if [ ! -s release_notes.md ]; then
              echo "未找到版本 ${VERSION} 的 changelog，使用默认模板"
              rm -f release_notes.md
            fi
          fi

          # 如果没有从 CHANGELOG.md 提取到内容，使用默认模板
          if [ ! -f "release_notes.md" ]; then
            cat << EOF > release_notes.md
          ## LunaBox ${{ steps.get_version.outputs.VERSION }}

          ### 📝 更新内容

          请查看 [Commits](https://github.com/${{ github.repository }}/commits/${{ needs.prepare-release.outputs.tag }})
          EOF
          fi

          # 添加下载说明
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 下载说明" >> release_notes.md
          echo "" >> release_notes.md
          echo "| 文件 | 说明 |" >> release_notes.md
          echo "|------|------|" >> release_notes.md
          echo "| \`*-windows-*-portable.zip\` | Windows 便携版，解压即用，数据存储在程序目录 |" >> release_notes.md
          echo "| \`*-windows-*-setup.exe\` | Windows 安装版，数据存储在 %APPDATA%\\\\LunaBox |" >> release_notes.md
          echo "| \`*-macos-*.dmg\` | macOS 磁盘映像，将 LunaBox 拖入 Applications |" >> release_notes.md
          echo "| \`*-linux-*.AppImage\` | Linux AppImage，依赖系统 GTK 3 与 libepoxy 运行库 |" >> release_notes.md
          echo "| \`*-linux-*.deb\` | Linux Debian/Ubuntu 安装包 |" >> release_notes.md
          echo "| \`*-linux-*.rpm\` | Linux Fedora/RHEL/openSUSE 安装包 |" >> release_notes.md
          echo "" >> release_notes.md
          echo "Windows 提供 AMD64、ARM64；macOS 提供 Intel AMD64、Apple Silicon ARM64；Linux 提供 AMD64、ARM64。" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🔗 相关链接" >> release_notes.md
          echo "" >> release_notes.md
          echo "- [查看所有提交](https://github.com/${{ github.repository }}/commits/${{ needs.prepare-release.outputs.tag }})" >> release_notes.md

          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable update channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          aws s3 cp update-assets/version.json "s3://${UPDATE_S3_BUCKET}/channels/stable/version.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=60" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
