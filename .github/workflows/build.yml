name: Build and Test

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'frontend/**'
      - 'internal/**'
      - 'cmd/**'
      - 'build/**'
      - 'scripts/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Taskfile.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test Compilation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install matching Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

      - name: Configure macOS compilation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo 'CGO_ENABLED=1' >> "$GITHUB_ENV"
          echo 'CGO_CFLAGS=-mmacosx-version-min=12.0' >> "$GITHUB_ENV"
          echo 'CGO_LDFLAGS=-mmacosx-version-min=12.0' >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"

      - name: Compile platform-specific Go tests
        run: go test -run '^$' ./internal/...

      - name: Build application with Wails v3
        run: wails3 build

    #   - name: Run Go tests
    #     run: go test ./... -v

