name: Auto Build Pre-release

on:
  workflow_dispatch:

concurrency:
  group: lunabox-dev-prerelease
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base-version: ${{ steps.version.outputs.base-version }}
      commit: ${{ steps.version.outputs.commit }}
      commit-count: ${{ steps.version.outputs.commit-count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version info
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.0.0')"
          base_version="${latest_tag#v}"
          commit="${GITHUB_SHA:0:7}"
          commit_count="$(git rev-list --count HEAD)"
          version="${base_version}-dev.${commit_count}+${commit}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base-version=$base_version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "commit-count=$commit_count" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  # 三端都用 apps/desktop/tools/release 构建，发布包的文件名与包内布局沿用 Wails 版（应用内更新与已安装的旧版依赖它）。
  build-windows:
    name: Windows ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            mode: portable
            runner: windows-2025
          - arch: arm64
            mode: portable
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
          - arch: amd64
            mode: installer
            runner: windows-2025
          - arch: arm64
            mode: installer
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      - name: Setup ARM64 CGO toolchain
        id: msys2-arm64
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: ${{ matrix.toolchain }}

      # tools/release 在 MSYS2_LOCATION/clangarm64/bin 下找 clang。
      - name: Export ARM64 MSYS2 location
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $Location = '${{ steps.msys2-arm64.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($Location)) {
            throw 'MSYS2 location output is empty.'
          }
          "MSYS2_LOCATION=$Location" >> $env:GITHUB_ENV

      # 安装版用 apps/desktop/packaging/windows/nsis/project.nsi 打包。
      - name: Install NSIS
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH

      - name: Build portable package
        if: matrix.mode == 'portable'
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}' -mode portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Name = 'LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable'
          $Artifact = "build/release/$Name.zip"
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'lunabox-portable-check'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          $Root = Join-Path $ExtractDir $Name
          $Files = @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe', '7z/7z.exe', '7z/7z.dll', 'README.txt')
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $Files += 'duckdb.dll'
          }
          foreach ($Path in $Files) {
            if (!(Test-Path -LiteralPath (Join-Path $Root $Path) -PathType Leaf)) {
              throw "Portable artifact is missing $Name/$Path."
            }
          }
          foreach ($Path in @('backups', 'covers', 'backgrounds', 'logs')) {
            if (!(Test-Path -LiteralPath (Join-Path $Root $Path) -PathType Container)) {
              throw "Portable artifact is missing directory $Name/$Path."
            }
          }

      - name: Build installer payload
        if: matrix.mode == 'installer'
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}' -mode installer-payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PayloadDir = 'build/release/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer'
          $Files = @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe', '7z/7z.exe', '7z/7z.dll')
          if ('${{ matrix.arch }}' -eq 'arm64') {
            $Files += 'duckdb.dll'
          }
          foreach ($Path in $Files) {
            if (!(Test-Path -LiteralPath (Join-Path $PayloadDir $Path) -PathType Leaf)) {
              throw "Installer payload is missing $Path."
            }
          }

          $SigningDir = 'build/signing/installer-payload'
          if (Test-Path -LiteralPath $SigningDir) {
            Remove-Item -LiteralPath $SigningDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $SigningDir | Out-Null
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            Copy-Item -LiteralPath (Join-Path $PayloadDir $Name) -Destination $SigningDir -Force
          }

      - name: Upload unsigned portable artifact
        id: upload-unsigned-portable
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: apps/desktop/build/release/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable artifact
        if: matrix.mode == 'portable'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG || 'github-portable' }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed

      - name: Verify signed portable artifact
        if: matrix.mode == 'portable'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Artifact = 'signed/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Signed portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'lunabox-signed-portable-check'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            $SignedFile = Get-ChildItem -Path $ExtractDir -Filter $Name -Recurse -File | Select-Object -First 1
            if ($null -eq $SignedFile) {
              throw "Signed portable artifact is missing $Name."
            }
            $Signature = Get-AuthenticodeSignature $SignedFile.FullName
            if ($Signature.Status -ne 'Valid') {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
          }

      - name: Upload portable artifact
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: apps/desktop/signed/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: Upload unsigned installer payload
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer-payload
          path: apps/desktop/build/signing/installer-payload/
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer payload
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-installer-payload' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed-payload

      - name: Build installer from signed payload
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PayloadDir = 'build/release/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer'
          foreach ($Name in @('LunaBox.exe', 'lunacli.exe', 'LunaBoxUpdater.exe')) {
            $SignedFile = "signed-payload/$Name"
            if (!(Test-Path -LiteralPath $SignedFile)) {
              throw 'Signed installer payload must contain LunaBox.exe, lunacli.exe, and LunaBoxUpdater.exe.'
            }
            $Signature = Get-AuthenticodeSignature $SignedFile
            if ($Signature.Status -ne 'Valid') {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
            Copy-Item -LiteralPath $SignedFile -Destination (Join-Path $PayloadDir $Name) -Force
          }

          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}' -mode installer-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/release/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Installer artifact not found: $Artifact"
          }

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: apps/desktop/build/release/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: apps/desktop/signed-installer

      - name: Verify signed installer
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $Artifact = 'signed-installer/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Signed installer artifact not found: $Artifact"
          }

      - name: Upload installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: apps/desktop/signed-installer/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }} / DMG
    needs: version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space for macOS build
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /

          developer_dir="$(xcode-select -p)"
          selected_xcode="$(cd "$developer_dir/../.." && pwd -P)"

          shopt -s nullglob
          for xcode_app in /Applications/Xcode*.app; do
            if [[ ! -d "$xcode_app" ]]; then
              echo "Skipping unavailable Xcode entry: $xcode_app"
              continue
            fi
            resolved_xcode="$(cd "$xcode_app" && pwd -P)"
            if [[ "$resolved_xcode" != "$selected_xcode" ]]; then
              sudo rm -rf "$xcode_app"
            fi
          done

          while IFS= read -r -d '' platform_dir; do
            sudo rm -rf "$platform_dir"
          done < <(
            find "$developer_dir/Platforms" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              ! -name 'MacOSX.platform' \
              -print0
          )

          sudo rm -rf \
            /Library/Developer/CoreSimulator \
            "$HOME/Library/Developer/CoreSimulator" \
            "$HOME/Library/Android" \
            "$HOME/.android"

          xcodebuild -version
          echo "Disk space after cleanup:"
          df -h /

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      - name: Build app bundle and DMG
        shell: bash
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          set -euo pipefail
          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}' -mode installer

          artifact='build/release/LunaBox-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg'
          test -f "$artifact"

          mount_dir="${RUNNER_TEMP}/lunabox-dmg-check"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$artifact" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null || true' EXIT
          for path in LunaBox.app/Contents/MacOS/LunaBox LunaBox.app/Contents/Resources/bin/lunacli LunaBox.app/Contents/Resources/bin/7zz; do
            if [[ ! -x "$mount_dir/$path" ]]; then
              echo "DMG is missing executable $path." >&2
              exit 1
            fi
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mount_dir/LunaBox.app/Contents/Info.plist")" = 'io.github.saramanda9988.lunabox'
          test -L "$mount_dir/Applications"
          codesign --verify --deep --strict "$mount_dir/LunaBox.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}
          path: apps/desktop/build/release/LunaBox-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }} / Packages
    needs: version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # 暂停 Linux ARM64 构建，待托管运行器环境恢复后重新启用。
          # - arch: arm64
          #   runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache: true
          cache-dependency-path: |
            apps/desktop/go.sum
            packages/backend/go.sum
            packages/updater/go.sum

      # MyGo 运行时才用 purego 加载 GTK，构建只需要 DuckDB 的 cgo 编译器；
      # desktop-file-utils 让 appimagetool 校验桌面入口。
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl desktop-file-utils

      - name: Install nFPM
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm --version

      - name: Install appimagetool
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            amd64) appimage_arch='x86_64' ;;
            arm64) appimage_arch='aarch64' ;;
            *) echo 'Unsupported AppImage architecture: ${{ matrix.arch }}' >&2; exit 1 ;;
          esac
          tool_path="${RUNNER_TEMP:-/tmp}/appimagetool-${appimage_arch}.AppImage"
          curl -fsSL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${appimage_arch}.AppImage" \
            -o "$tool_path"
          chmod 755 "$tool_path"
          sudo install -m 0755 "$tool_path" /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - name: Build Linux packages
        shell: bash
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_KUNGAL_CLIENT_ID: ${{ vars.LUNABOX_KUNGAL_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          go run ./tools/release -version '${{ needs.version.outputs.version }}' -arch '${{ matrix.arch }}' -mode all

          base="$PWD/build/release/LunaBox-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}"
          test -x "$base.AppImage"
          test -f "$base.deb"
          test -f "$base.rpm"

          extract_dir="${RUNNER_TEMP}/lunabox-appimage-check"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          (cd "$extract_dir" && env -u APPIMAGE_EXTRACT_AND_RUN "$base.AppImage" --appimage-extract >/dev/null)
          for path in AppRun usr/bin/LunaBox usr/bin/lunacli usr/bin/7zz; do
            if [[ ! -x "$extract_dir/squashfs-root/$path" ]]; then
              echo "AppImage is missing executable $path." >&2
              exit 1
            fi
          done
          for path in \
            io.github.saramanda9988.lunabox.desktop \
            io.github.saramanda9988.lunabox.png \
            usr/share/applications/io.github.saramanda9988.lunabox.desktop \
            usr/share/icons/hicolor/512x512/apps/io.github.saramanda9988.lunabox.png; do
            if [[ ! -f "$extract_dir/squashfs-root/$path" ]]; then
              echo "AppImage is missing $path." >&2
              exit 1
            fi
          done

          deb_files="$(dpkg-deb -c "$base.deb")"
          for path in ./usr/bin/LunaBox ./usr/bin/lunacli ./usr/lib/lunabox/LunaBox ./usr/lib/lunabox/7zz; do
            if ! grep -Eq "^-rwxr-xr-x .* ${path}\$" <<<"$deb_files"; then
              echo "deb is missing executable $path." >&2
              exit 1
            fi
          done
          for path in \
            ./usr/share/applications/io.github.saramanda9988.lunabox.desktop \
            ./usr/share/icons/hicolor/512x512/apps/io.github.saramanda9988.lunabox.png; do
            if ! grep -Eq " ${path}\$" <<<"$deb_files"; then
              echo "deb is missing $path." >&2
              exit 1
            fi
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            apps/desktop/build/release/LunaBox-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.deb
            apps/desktop/build/release/LunaBox-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.rpm
            apps/desktop/build/release/LunaBox-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  create-prerelease:
    name: Create pre-release
    needs: [version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunabox-*
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 9
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Get recent commits
        id: commits
        shell: bash
        run: |
          {
            echo 'messages<<EOF'
            git log --pretty=format:'- %s (%h)' -n 5
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          build_timestamp="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cat <<'EOF' > release_notes.md
          ## 🚀 LunaBox Development Build

          **⚠️ 这是一个自动构建的开发版本**

          ### 📋 版本信息

          - **版本号**: `${{ needs.version.outputs.version }}`
          - **基于版本**: `${{ needs.version.outputs.base-version }}`
          - **提交**: [`${{ needs.version.outputs.commit }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **构建时间**: __BUILD_TIMESTAMP__

          ### 📝 最近提交

          ${{ steps.commits.outputs.messages }}

          ### 📦 下载说明

          | 文件 | 说明 |
          |------|------|
          | `*-windows-*-portable.zip` | Windows 便携版，解压即用，数据存储在程序目录 |
          | `*-windows-*-setup.exe` | Windows NSIS 安装版，数据存储在 `%APPDATA%\\LunaBox` |
          | `*-macos-*.dmg` | macOS 磁盘映像，将 LunaBox 拖入 Applications |
          | `*-linux-*.AppImage` | Linux AppImage，依赖系统 GTK 3 与 libepoxy 运行库 |
          | `*-linux-*.deb` | Linux Debian/Ubuntu 安装包 |
          | `*-linux-*.rpm` | Linux Fedora/RHEL/openSUSE 安装包 |

          Windows 提供 AMD64、ARM64；macOS 提供 Intel AMD64、Apple Silicon ARM64；Linux 提供 AMD64。

          ### ⚠️ 注意事项

          - 此版本为开发测试版本，可能存在未知问题
          - 建议测试前做好数据备份
          - 如遇问题，请在 [Issues](https://github.com/${{ github.repository }}/issues) 中反馈
          EOF
          sed -i "s|__BUILD_TIMESTAMP__|$build_timestamp|" release_notes.md
          cat release_notes.md

      - name: Replace rolling pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes || true
          git push origin :refs/tags/dev-latest || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f dev-latest
          git push -f origin dev-latest

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: 开发版 - ${{ needs.version.outputs.version }}
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
