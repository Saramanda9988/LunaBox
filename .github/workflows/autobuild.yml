name: Auto Build Pre-release

on:
  workflow_dispatch:

concurrency:
  group: lunabox-dev-prerelease
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base-version: ${{ steps.version.outputs.base-version }}
      commit: ${{ steps.version.outputs.commit }}
      commit-count: ${{ steps.version.outputs.commit-count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version info
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.0.0')"
          base_version="${latest_tag#v}"
          commit="${GITHUB_SHA:0:7}"
          commit_count="$(git rev-list --count HEAD)"
          version="${base_version}-dev.${commit_count}+${commit}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base-version=$base_version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "commit-count=$commit_count" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  build-windows:
    name: Windows ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            mode: portable
            runner: windows-2025
          - arch: arm64
            mode: portable
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
          - arch: amd64
            mode: installer
            runner: windows-2025
          - arch: arm64
            mode: installer
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup ARM64 CGO toolchain
        id: msys2-arm64
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: ${{ matrix.toolchain }}

      - name: Export ARM64 MSYS2 location
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $Location = '${{ steps.msys2-arm64.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($Location)) {
            throw 'MSYS2 location output is empty.'
          }
          "MSYS2_LOCATION=$Location" >> $env:GITHUB_ENV

      - name: Install NSIS
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH

      - name: Install matching Wails v3 CLI
        shell: pwsh
        run: |
          $Version = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3).Trim()
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$Version"
          $Installed = (& wails3 version 2>&1 | Out-String).Trim()
          if ($Installed -ne $Version) {
            throw "wails3 version mismatch: expected $Version, found $Installed"
          }

      - name: Build portable package
        if: matrix.mode == 'portable'
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build.bat portable '${{ needs.version.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/bin/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Portable artifact not found: $Artifact"
          }

      - name: Build installer payload
        if: matrix.mode == 'installer'
        shell: pwsh
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build.bat installer-payload '${{ needs.version.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (!(Test-Path -LiteralPath 'build/windows/payload/${{ matrix.arch }}/LunaBox.exe') -or !(Test-Path -LiteralPath 'build/windows/payload/${{ matrix.arch }}/lunacli.exe')) {
            throw 'Installer payload must contain LunaBox.exe and lunacli.exe.'
          }

      - name: Upload unsigned portable artifact
        id: upload-unsigned-portable
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: build/bin/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable artifact
        if: matrix.mode == 'portable'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG || 'github-portable' }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed

      - name: Verify signed portable artifact
        if: matrix.mode == 'portable'
        shell: pwsh
        run: |
          $Artifact = 'signed/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Signed portable artifact not found: $Artifact"
          }

      - name: Upload portable artifact
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: signed/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: Upload unsigned installer payload
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer-payload
          path: |
            build/windows/payload/${{ matrix.arch }}/LunaBox.exe
            build/windows/payload/${{ matrix.arch }}/lunacli.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer payload
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-installer-payload' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-payload

      - name: Build installer from signed payload
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $SignedGui = 'signed-payload/LunaBox.exe'
          $SignedCli = 'signed-payload/lunacli.exe'
          if (!(Test-Path -LiteralPath $SignedGui) -or !(Test-Path -LiteralPath $SignedCli)) {
            throw 'Signed installer payload must contain LunaBox.exe and lunacli.exe.'
          }

          $PayloadDir = 'build/windows/payload/${{ matrix.arch }}'
          Copy-Item -LiteralPath $SignedGui -Destination "$PayloadDir/LunaBox.exe" -Force
          Copy-Item -LiteralPath $SignedCli -Destination "$PayloadDir/lunacli.exe" -Force
          .\scripts\build.bat installer-package '${{ needs.version.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/bin/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Installer artifact not found: $Artifact"
          }

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: build/bin/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-installer

      - name: Verify signed installer
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $Artifact = 'signed-installer/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Signed installer artifact not found: $Artifact"
          }

      - name: Upload installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: signed-installer/LunaBox-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }} / DMG
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space for macOS build
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /

          developer_dir="$(xcode-select -p)"
          selected_xcode="$(cd "$developer_dir/../.." && pwd -P)"

          shopt -s nullglob
          for xcode_app in /Applications/Xcode*.app; do
            if [[ ! -d "$xcode_app" ]]; then
              echo "Skipping unavailable Xcode entry: $xcode_app"
              continue
            fi
            resolved_xcode="$(cd "$xcode_app" && pwd -P)"
            if [[ "$resolved_xcode" != "$selected_xcode" ]]; then
              sudo rm -rf "$xcode_app"
            fi
          done

          while IFS= read -r -d '' platform_dir; do
            sudo rm -rf "$platform_dir"
          done < <(
            find "$developer_dir/Platforms" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              ! -name 'MacOSX.platform' \
              -print0
          )

          sudo rm -rf \
            /Library/Developer/CoreSimulator \
            "$HOME/Library/Developer/CoreSimulator" \
            "$HOME/Library/Android" \
            "$HOME/.android"

          xcodebuild -version
          echo "Disk space after cleanup:"
          df -h /

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install matching Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: Build app bundle and DMG
        shell: bash
        env:
          LUNABOX_BANGUMI_CLIENT_ID: ${{ vars.LUNABOX_BANGUMI_CLIENT_ID }}
          LUNABOX_BANGUMI_CLIENT_SECRET: ${{ secrets.LUNABOX_BANGUMI_CLIENT_SECRET }}
          LUNABOX_HIKARINAGI_CLIENT_ID: ${{ vars.LUNABOX_HIKARINAGI_CLIENT_ID }}
          LUNABOX_TOUCHGAL_TOKEN: ${{ secrets.LUNABOX_TOUCHGAL_TOKEN }}
          LUNABOX_UMBRA_CLIENT_ID: ${{ vars.LUNABOX_UMBRA_CLIENT_ID }}
          LUNABOX_UMBRA_REGISTRATION_TOKEN: ${{ secrets.LUNABOX_UMBRA_REGISTRATION_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh installer '${{ needs.version.outputs.version }}' '${{ matrix.arch }}'
          test -f 'build/bin/LunaBox-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg'

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lunabox-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}
          path: build/bin/LunaBox-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  create-prerelease:
    name: Create pre-release
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunabox-*
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} release/ \;
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Get recent commits
        id: commits
        shell: bash
        run: |
          {
            echo 'messages<<EOF'
            git log --pretty=format:'- %s (%h)' -n 5
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          build_timestamp="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cat <<'EOF' > release_notes.md
          ## 🚀 LunaBox Development Build

          **⚠️ 这是一个自动构建的开发版本**

          ### 📋 版本信息

          - **版本号**: `${{ needs.version.outputs.version }}`
          - **基于版本**: `${{ needs.version.outputs.base-version }}`
          - **提交**: [`${{ needs.version.outputs.commit }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **构建时间**: __BUILD_TIMESTAMP__

          ### 📝 最近提交

          ${{ steps.commits.outputs.messages }}

          ### 📦 下载说明

          | 文件 | 说明 |
          |------|------|
          | `*-windows-*-portable.zip` | Windows 便携版，解压即用，数据存储在程序目录 |
          | `*-windows-*-setup.exe` | Windows NSIS 安装版，数据存储在 `%APPDATA%\\LunaBox` |
          | `*-macos-*.dmg` | macOS 磁盘映像，将 LunaBox 拖入 Applications |

          Windows 提供 AMD64、ARM64；macOS 提供 Intel AMD64、Apple Silicon ARM64。

          ### ⚠️ 注意事项

          - 此版本为开发测试版本，可能存在未知问题
          - macOS 开发构建默认使用 ad-hoc 签名；正式分发应配置 Developer ID 与 notarization
          - 建议测试前做好数据备份
          - 如遇问题，请在 [Issues](https://github.com/${{ github.repository }}/issues) 中反馈
          EOF
          sed -i "s|__BUILD_TIMESTAMP__|$build_timestamp|" release_notes.md
          cat release_notes.md

      - name: Replace rolling pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes || true
          git push origin :refs/tags/dev-latest || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f dev-latest
          git push -f origin dev-latest

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: 开发版 - ${{ needs.version.outputs.version }}
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
